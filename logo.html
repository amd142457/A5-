<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="h-[100vh] bg-white">
    <section class="flex justify-center items-center h-[100%]">
      <div class="bg-base-200 border-base-300 rounded-box w-xs border p-4">
        <div class="text-center space-y-3">
          <img src="github-logo.png" alt="" />
          <h2 class="font-bold text-2xl">GitHub Issues Tracker</h2>
          <p class="text-gray-600">Sign in to manage your issues</p>
        </div>

        <fieldset class="fieldset space-y-3">
          <label class="label">User Name</label>
          <input
            id="user-input"
            type="email"
            class="input"
            placeholder="Enter your username"
          />

          <label class="label">Password</label>
          <input
            id="input-pass"
            type="password"
            class="input"
            placeholder="Password"
          />

          <button id="btn" class="btn btn-neutral mt-4">Login</button>
        </fieldset>
      </div>
    </section>
    <script src="logo.js"></script>
  </body>
</html>
