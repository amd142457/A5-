<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Issues Tracker</title>

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="space-y-5 bg-gray-100">
    <header>
      <nav
        class="w-11/12 mx-auto flex flex-col md:flex-row gap-4 justify-between mt-6 items-center"
      >
        <div class="flex gap-2 items-center">
          <img src="assets/github-logo.png" class="h-10 w-10 md:h-14 md:w-14" />
          <h2 class="text-2xl md:text-4xl font-bold text-center md:text-left">
            GitHub Issues Tracker
          </h2>
        </div>

        <div class="flex gap-2 w-full md:w-auto">
          <label class="input w-full">
            <svg
              class="h-[1em] opacity-50"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
            >
              <g stroke-width="2.5" fill="none" stroke="currentColor">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </g>
            </svg>

            <input
              id="searchInput"
              type="search"
              required
              placeholder="Search"
              class="w-full"
            />
          </label>

          <button id="searchBtn" class="btn btn-primary">Search</button>
        </div>
      </nav>
    </header>

    <section>
      <div id="button" class="w-11/12 mx-auto flex flex-wrap gap-3">
        <button id="all" class="btn btn-primary">All</button>
        <button id="open" class="btn">Open</button>
        <button id="closed" class="btn">Closed</button>
      </div>

      <div
        class="flex flex-col md:flex-row gap-4 justify-between w-11/12 mx-auto p-4 mt-4 shadow-sm bg-white rounded"
      >
        <div class="flex gap-2 items-center">
          <img src="assets/Aperture.png" />

          <div>
            <h2 class="font-bold"><span id="count">50</span> Issues</h2>

            <p class="text-[14px]">Track and manage your project issues</p>
          </div>
        </div>

        <div class="flex gap-4 items-center">
          <div class="flex gap-2 items-center">
            <div class="w-3 h-3 rounded-full bg-[#00A96E]"></div>
            <p>Open</p>
          </div>

          <div class="flex gap-2 items-center">
            <div class="w-3 h-3 rounded-full bg-[#A855F7]"></div>
            <p>Closed</p>
          </div>
        </div>
      </div>
    </section>

    <!-- CARD SECTION -->

    <section
      id="allCard"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 w-11/12 mx-auto"
    ></section>

    <!-- MODAL -->

    <dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle">
      <div class="modal-box space-y-4">
        <div id="datails-container" class="space-y-3"></div>

        <div class="modal-action">
          <form method="dialog">
            <button class="btn btn-primary">Close</button>
          </form>
        </div>
      </div>
    </dialog>

    <script src="A4.js"></script>
  </body>
</html>
